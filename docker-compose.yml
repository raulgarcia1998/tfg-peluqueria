# Configuración simplificada para desarrollo local:
# Solo levanta PostgreSQL. Backend y Frontend se ejecutan en máquina local con npm.

version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: tfg_peluqueria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-peluqueria}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
