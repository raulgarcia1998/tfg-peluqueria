<div class="flex h-screen overflow-hidden bg-surface">

  <!-- Sidebar -->
  <aside class="flex flex-col w-64 border-r shrink-0 backdrop-blur-xl bg-black/[0.02] border-gray-200/10">

    <div class="flex items-center gap-3 px-6 py-6 border-b border-gray-200/10">
      <div class="w-10 h-10 rounded-2xl flex items-center justify-center shrink-0 bg-accent/10 border border-accent/30 shadow-lg shadow-accent/5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" />
          <line x1="20" y1="4" x2="8.12" y2="15.88" /><line x1="14.47" y1="14.48" x2="20" y2="20" /><line x1="8.12" y1="8.12" x2="12" y2="12" />
        </svg>
      </div>
      <div>
        <p class="text-gray-900 font-bold text-lg tracking-tight leading-none">BarberPro</p>
        <p class="text-[10px] mt-1 font-bold uppercase tracking-widest text-accent/80">Portal Cliente</p>
      </div>
    </div>

    <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
      @for (route of userRoutes; track route.path; let idx = $index) {
        @if (route.section && route.section !== userRoutes[idx - 1]?.section) {
          <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-gray-900/20 px-3 pt-4 pb-2">{{ route.section }}</p>
        }
        <a [routerLink]="route.path" [routerLinkActiveOptions]="route.path === '/user/dashboard' ? {exact:true} : {}" routerLinkActive="bg-accent/10 text-accent"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-600 transition-all hover:bg-black/5 hover:text-gray-900 group">
          <ng-container [ngSwitch]="route.iconType">
            <svg *ngSwitchCase="'home'" class="w-5 h-5 opacity-60 group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <svg *ngSwitchCase="'calendar'" class="w-5 h-5 opacity-60 group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <svg *ngSwitchCase="'edit'" class="w-5 h-5 opacity-60 group-hover:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </ng-container>
          {{ route.label }}
        </a>
      }
    </nav>

    <!-- User Section -->
    <div class="p-4 border-t border-gray-200/10">
      <div class="flex items-center gap-3 p-3 rounded-2xl bg-black/[0.04] border border-gray-200/5 shadow-inner">
        <a routerLink="/perfil" title="Ver mi perfil" class="flex items-center gap-3 flex-1 min-w-0 rounded-lg hover:opacity-80 transition-opacity">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-sm font-black text-surface bg-accent shadow-lg shadow-accent/20">{{ iniciales() }}</div>
          <div class="flex-1 min-w-0">
            <p class="text-gray-900 text-xs font-bold truncate">{{ nombreUsuario() }}</p>
            <p class="text-gray-900/40 text-[10px] font-medium uppercase tracking-wider">Cliente</p>
          </div>
        </a>
        <button (click)="logout()" title="Cerrar sesión" class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-900/30 hover:bg-red-500/20 hover:text-red-600 transition-all">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col relative overflow-hidden">
    <!-- Header -->
    <header class="h-20 px-10 flex items-center justify-between border-b border-gray-200/5 bg-surface/80 backdrop-blur-md z-10">
      <div class="flex items-center gap-4">
        <div class="w-1 h-8 rounded-full bg-accent/30"></div>
        <h2 class="text-lg font-medium text-gray-900/90">Dashboard</h2>
      </div>
      <div class="flex items-center gap-6">
        <div class="text-right">
          <p class="text-gray-900/30 text-[10px] font-bold uppercase tracking-widest">Hoy</p>
          <p class="text-sm text-gray-900/80 font-medium">{{ fechaActual() }}</p>
        </div>
      </div>
    </header>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto p-10 relative custom-scrollbar">
      <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-accent/5 rounded-full blur-[120px] pointer-events-none -z-10 animate-pulse"></div>
      <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-blue-500/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
      <div class="max-w-7xl mx-auto">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
