<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden"
     style="background: linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 60%,#16213e 100%)">

  <!-- Orbs decorativos -->
  <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(212,175,55,.18),transparent 70%)"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full pointer-events-none"
       style="background:radial-gradient(circle,rgba(212,175,55,.12),transparent 70%)"></div>

  <div class="w-full max-w-md relative z-10">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4"
           style="background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3)">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none"
             stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
          <line x1="20" y1="4" x2="8.12" y2="15.88"/>
          <line x1="14.47" y1="14.48" x2="20" y2="20"/>
          <line x1="8.12" y1="8.12" x2="12" y2="12"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">BarberPro</h1>
      <p class="text-gray-400 mt-1 text-sm">Tu peluquería de confianza</p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl p-8 shadow-2xl"
         style="background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.09)">

      <h2 class="text-xl font-semibold text-white mb-6">Iniciar sesión</h2>

      <!-- Error -->
      @if (errorMsg()) {
        <div class="mb-4 px-4 py-3 rounded-xl text-sm text-red-300 flex items-center gap-2"
             style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          {{ errorMsg() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Correo electrónico</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-500">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input id="login-email" type="email" formControlName="email"
              placeholder="tu@email.com" autocomplete="email"
              class="w-full pl-10 pr-4 py-3 rounded-xl text-sm text-white placeholder-gray-600 outline-none transition-all"
              style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)">
          </div>
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <p class="mt-1 text-xs text-red-400">Introduce un email válido</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-gray-500">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="login-password" [type]="showPwd() ? 'text' : 'password'" formControlName="password"
              placeholder="••••••••" autocomplete="current-password"
              class="w-full pl-10 pr-10 py-3 rounded-xl text-sm text-white placeholder-gray-600 outline-none transition-all"
              style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)">
            <button type="button" (click)="showPwd.set(!showPwd())"
              class="absolute inset-y-0 right-3 flex items-center text-gray-500 hover:text-gray-300 transition-colors">
              @if (showPwd()) {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              } @else {
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              }
            </button>
          </div>
          <p class="mt-2 text-right">
            <a routerLink="/forgot-password" class="text-xs font-medium hover:underline" style="color:#d4af37">
              ¿Olvidaste tu contraseña?
            </a>
          </p>
        </div>

        <!-- Submit -->
        <button id="btn-login" type="submit" [disabled]="form.invalid || loading()"
          class="w-full py-3 rounded-xl font-semibold text-sm text-gray-900 flex items-center justify-center gap-2 transition-all duration-200 hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
          style="background:linear-gradient(135deg,#d4af37,#f0c952);box-shadow:0 4px 20px rgba(212,175,55,.35)">
          @if (loading()) {
            <svg class="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" stroke-opacity=".25"/>
              <path d="M12 2a10 10 0 0 1 10 10"/>
            </svg>
            Entrando...
          } @else { Iniciar sesión }
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        ¿No tienes cuenta?
        <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl() }" 
           class="font-semibold hover:underline" style="color:#d4af37">
          Regístrate aquí
        </a>
      </p>
    </div>
  </div>
</div>
